name: Motion Studio quality CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: Test contracts and quality modules
        run: npm test
      - name: Verify legacy Windows font URL compatibility
        run: npm run test:font-compat
      - name: Verify B-roll schema and plugin parity
        run: npm run test:p2
      - name: Verify 21 executable style recipes
        run: npm run test:p3
      - name: Verify 12 executable specialized workflows
        run: npm run test:p4
      - name: Verify P5 articulated characters and contact contracts
        run: npm run test:p5
      - name: Verify P6 synchronized audio and deterministic simulations
        run: npm run test:p6
      - name: Verify P7 external adapter contracts and safe mock requests
        run: npm run test:p7
      - name: Verify P8 complete JSON coverage and strict honesty
        run: npm run test:p8
      - name: Verify P8.1 executable authoring workflows
        run: npm run test:p81
      - name: Verify P8.2 loop closure and timed pacing defects
        run: npm run test:p82
      - name: Verify P8.3 source-reference comparison and review safety
        run: npm run test:p83
      - name: Verify final P8 reference-aware rerender gate
        run: npm run test:p8:final
      - name: Verify canonical plugin package
        run: npm run plugin:check
      - name: Lint and types
        run: npm run lint
      - name: Build Studio
        run: npm run studio:build
      - name: Guard browser startup against Node-only imports
        run: node --test browser-style-catalog.test.mjs
      - name: Guard visual storytelling and vertical composition regressions
        run: node --test art-direction-quality.test.mjs
      - name: Guard automatic cross-scene SVG identifier repair
        run: node --test scene-id-repair.test.mjs
      - name: Record source-integration parity (informational)
        run: npm run integration:status
      - name: Five-domain contract acceptance
        run: npm run accept:five
      - name: Upload acceptance JSON and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-five-topics
          path: out/acceptance-five-topics/
          if-no-files-found: warn

  render-acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: Install FFmpeg and FFprobe for real MP4 tests
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Check video prerequisites
        run: |
          node --version
          ffmpeg -version | head -1
          ffprobe -version | head -1
          google-chrome --version || true
      - name: Verify v4 render evidence and clipped pilot sampling
        run: npm run test:production-v4
      - name: Render and inspect five real MP4s
        run: npm run accept:five:render
      - name: Render real transparent ProRes and composite with audio
        run: npm run accept:broll:alpha
        env:
          MOTION_P8_EVIDENCE_DIR: out/p2-alpha
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-five-topics-mp4
          path: out/acceptance-five-topics/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload P2 alpha MOV and MP4 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-broll-transparent-mov-and-composite
          path: out/p2-alpha/
          if-no-files-found: warn
          retention-days: 14
  styles-acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Render 21 distinct style examples and contact sheet
        run: npm run accept:styles:21
      - name: Upload 21 MP4 examples and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-styles-21-mp4-and-contact-sheet
          path: out/p3-style-gallery/
          if-no-files-found: warn
          retention-days: 14
  workflows-acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Render 12 workflow MP4s, GIF and real comparison
        run: npm run accept:workflows:p4
      - name: Upload workflow videos, GIF and inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-workflows-video-gif-and-report
          path: out/p4-specialized/
          if-no-files-found: warn
          retention-days: 14
  characters-acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Render and audit five character actions
        run: npm run accept:characters:p5
      - name: Upload character MP4s, poses, contact evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-character-actions-and-contact-audit
          path: out/p5-characters/
          if-no-files-found: warn
          retention-days: 14
  audio-simulations-acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Render and analyze 4 simulations with real stereo AAC mix
        run: npm run accept:audio-simulations:p6
      - name: Upload P6 MP4s, stereo mix, contact sheet and analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-audio-simulations-video-and-mix
          path: out/p6-audio-simulations/
          if-no-files-found: warn
          retention-days: 14
  homologation-p8:
    needs: [validate, render-acceptance, styles-acceptance, workflows-acceptance, characters-acceptance, audio-simulations-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: Install FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: p2-broll-transparent-mov-and-composite
          path: out/p8-evidence/broll
      - uses: actions/download-artifact@v4
        with:
          name: p3-styles-21-mp4-and-contact-sheet
          path: out/p8-evidence/styles
      - uses: actions/download-artifact@v4
        with:
          name: p4-workflows-video-gif-and-report
          path: out/p8-evidence/workflows
      - uses: actions/download-artifact@v4
        with:
          name: p5-character-actions-and-contact-audit
          path: out/p8-evidence/characters
      - uses: actions/download-artifact@v4
        with:
          name: p6-audio-simulations-video-and-mix
          path: out/p8-evidence/audio
      - name: Validate 33 full JSONs, shared contracts and inspect real media
        run: npm run homologation:p8:ci
      - name: Upload P8 33 JSONs and evidence matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-33-json-evidence-and-blockers
          path: out/p8-final/
          if-no-files-found: warn
          retention-days: 30
