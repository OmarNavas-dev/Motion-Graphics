name: Motion Studio quality CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: Test contracts and quality modules
        run: npm test
      - name: Verify B-roll schema and plugin parity
        run: npm run test:p2
      - name: Verify 21 executable style recipes
        run: npm run test:p3
      - name: Verify 12 executable specialized workflows
        run: npm run test:p4
      - name: Verify P5 articulated characters and contact contracts
        run: npm run test:p5
      - name: Verify P6 synchronized audio and deterministic simulations
        run: npm run test:p6
      - name: Verify P7 external adapter contracts and safe mock requests
        run: npm run test:p7
      - name: Verify canonical plugin package
        run: npm run plugin:check
      - name: Lint and types
        run: npm run lint
      - name: Build Studio
        run: npm run studio:build
      - name: Record source-integration parity (informational)
        run: npm run integration:status
      - name: Five-domain contract acceptance
        run: npm run accept:five
      - name: Upload acceptance JSON and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-five-topics
          path: out/acceptance-five-topics/
          if-no-files-found: warn

  render-acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: Install FFmpeg and FFprobe for real MP4 tests
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Check video prerequisites
        run: |
          node --version
          ffmpeg -version | head -1
          ffprobe -version | head -1
          google-chrome --version || true
      - name: Render and inspect five real MP4s
        run: npm run accept:five:render
      - name: Render real transparent ProRes and composite with audio
        run: npm run accept:broll:alpha
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-five-topics-mp4
          path: out/acceptance-five-topics/
          if-no-files-found: warn
          retention-days: 7
  styles-acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Render 21 distinct style examples and contact sheet
        run: npm run accept:styles:21
      - name: Upload 21 MP4 examples and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-styles-21-mp4-and-contact-sheet
          path: out/p3-style-gallery/
          if-no-files-found: warn
          retention-days: 14
  workflows-acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Render 12 workflow MP4s, GIF and real comparison
        run: npm run accept:workflows:p4
      - name: Upload workflow videos, GIF and inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-workflows-video-gif-and-report
          path: out/p4-specialized/
          if-no-files-found: warn
          retention-days: 14
  characters-acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Render and audit five character actions
        run: npm run accept:characters:p5
      - name: Upload character MP4s, poses, contact evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-character-actions-and-contact-audit
          path: out/p5-characters/
          if-no-files-found: warn
          retention-days: 14
  audio-simulations-acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Render and analyze 4 simulations with real stereo AAC mix
        run: npm run accept:audio-simulations:p6
      - name: Upload P6 MP4s, stereo mix, contact sheet and analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-audio-simulations-video-and-mix
          path: out/p6-audio-simulations/
          if-no-files-found: warn
          retention-days: 14
